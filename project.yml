name: LastSignal
options:
  bundleIdPrefix: com.hggdet
  # Keep the generated project readable by the CI runner's Xcode
  # 15.4 (macos-14): the newest XcodeGen otherwise emits the
  # Xcode 16 project format (77), which that Xcode refuses to open.
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  LastSignal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LastSignal
        excludes:
          - "Info.plist"
    info:
      path: LastSignal/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hggdet.lastsignal
        PRODUCT_NAME: LastSignal
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets: []
